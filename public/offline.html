<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Educ'Academy - Mode Hors Connexion</title>
    <style>
        :root {
            --ea-primary: #095b86;
            --ea-accent: #dd520e;
            --ea-bg: #f4f8fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ea-bg);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 1.25rem;
            padding: 2.5rem 1.75rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(9, 91, 134, 0.1);
            border-top: 4px solid var(--ea-accent);
        }
        .logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid var(--ea-accent);
            object-fit: cover;
            margin-bottom: 1rem;
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(221, 82, 14, 0.1);
            color: var(--ea-accent);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1.25rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .slogan {
            font-style: italic;
            font-size: 0.85rem;
            color: var(--ea-primary);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: block;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--ea-primary) 0%, #0d7db3 100%);
            color: #ffffff;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 0.65rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(9, 91, 134, 0.25);
            transition: transform 0.15s ease;
            width: 100%;
            font-size: 1rem;
        }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/images/logo.jpeg" alt="Logo Educ'Academy" class="logo" onerror="this.style.display='none'">
        <div class="icon-circle">📡</div>
        <h1>Vous êtes hors connexion</h1>
        <span class="slogan">« Construis ton avenir et Prépare-toi à le Vivre »</span>
        <p>Il semble que vous n'ayez plus d'accès internet actif. Veuillez vérifier votre connexion de données mobiles ou votre Wi-Fi pour continuer.</p>
        <button class="btn" onclick="window.location.reload()">🔄 Réessayer la connexion</button>
    </div>
</body>
</html>
